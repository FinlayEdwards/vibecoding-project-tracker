    <script>
      // Apply the theme before first paint so there is no light flash in dark mode.
      // Saved choice ('light' | 'dark' | 'system') comes from the in-app toggle.
      (function () {
        var choice = 'system';
        try {
          choice = JSON.parse(localStorage.getItem('vibetracker.theme')) || 'system';
        } catch (e) {}
        var dark = choice === 'dark' || (choice === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
